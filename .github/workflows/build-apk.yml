name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME is $JAVA_HOME"
          # Detect the active Java major version
          JAVA_VER=$(java -version 2>&1 | head -n 1 | cut -d'"' -f2 | cut -d'.' -f1)
          # Handle potential leading version digits
          if [[ "$JAVA_VER" == *" "* ]]; then
            JAVA_VER=$(echo "$JAVA_VER" | awk '{print $1}')
          fi
          echo "Detected Java Major Version: $JAVA_VER"
          if [ -z "$JAVA_VER" ] || [ "$JAVA_VER" -eq "$JAVA_VER" ] 2>/dev/null; then
            :
          else
            echo "Error: Java version could not be detected."
            exit 1
          fi
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java version is lower than 17 (Detected $JAVA_VER)."
            exit 1
          fi
          echo "Java version verification succeeded."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Skipping generation."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create debug.keystore."
            exit 1
          fi
          echo "debug.keystore verified successfully."

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected APK file was not found at $EXPECTED_APK."
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          
          # Validate APK file details
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Selected path is not a file."
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: Selected APK is empty."
            exit 1
          fi
          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "Error: Selected file does not have .apk extension."
            exit 1
          fi
          echo "APK successfully verified at: $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          # Create temporary folder for release asset inside GITHUB_WORKSPACE but not tracked
          TEMP_RELEASE_DIR=$(mktemp -d)
          
          # Sanitize repository name
          REPO_NAME_RAW="${{ github.event.repository.name }}"
          # Replace unsafe filename characters (only keep alphanumeric, dashes, underscores)
          REPO_NAME_SAFE=$(echo "$REPO_NAME_RAW" | tr -cd 'a-zA-Z0-9_-')
          if [ -z "$REPO_NAME_SAFE" ]; then
            REPO_NAME_SAFE="android-app"
          fi
          
          # Construct target filename format
          FINAL_APK_NAME="${REPO_NAME_SAFE}-debug-build-${{ github.run_number }}.apk"
          FINAL_APK_PATH="${TEMP_RELEASE_DIR}/${FINAL_APK_NAME}"
          
          # Copy APK
          cp app/build/outputs/apk/debug/app-debug.apk "$FINAL_APK_PATH"
          
          # Validate prepared asset
          if [ ! -f "$FINAL_APK_PATH" ] || [ ! -s "$FINAL_APK_PATH" ]; then
            echo "Error: Prepared release asset is invalid or empty."
            exit 1
          fi
          
          echo "Prepared release asset at: $FINAL_APK_PATH"
          echo "asset_path=$FINAL_APK_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$FINAL_APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ ! -f "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset does not exist."
            exit 1
          fi
          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is empty."
            exit 1
          fi
          if [[ "$ASSET_PATH" != *.apk ]]; then
            echo "Error: Release asset is not a .apk file."
            exit 1
          fi
          
          # Create unique release tag format
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          echo "Creating Release with Tag: $RELEASE_TAG"
          
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "### Automated Debug APK Build Info
          This is an automatically generated debug APK.
          
          - **Built by**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit SHA**: \`${{ github.sha }}\`
          
          *Note: This APK is intended for testing. It is not a Play Store production release and is signed only with a temporary debug keystore.*"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_STATUS="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          
          if [ "$RELEASE_STATUS" = "success" ]; then
            echo "GitHub Release publishing succeeded!"
            
            # Verify the release with gh release view
            gh release view "$RELEASE_TAG"
            
            # Construct direct Release URL
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
            
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_NAME}"
            
            # Set step summary
            echo "### 🚀 Debug APK Successfully Published!" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Page**: [Download APK](${RELEASE_URL})" >> $GITHUB_STEP_SUMMARY
            echo "- **Asset Filename**: \`${ASSET_NAME}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Build Run**: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Backup Option**: You can also download the standard GitHub Actions build artifact \`app-debug-apk\` from the summary page." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::GitHub Release publishing failed or was skipped."
            echo "APK build succeeded and Actions artifact remains fully available."
            
            echo "### ⚠️ Debug APK Build Succeeded (Release Failed/Skipped)" >> $GITHUB_STEP_SUMMARY
            echo "The debug APK was successfully built and verified!" >> $GITHUB_STEP_SUMMARY
            echo "- **Build Run**: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Actions Artifact**: Download the \`app-debug-apk\` artifact package directly from this run's Summary page." >> $GITHUB_STEP_SUMMARY
            echo "- **Reason**: The GitHub Release publish step failed (this is shown as a warning and did not break the overall build status)." >> $GITHUB_STEP_SUMMARY
          fi
